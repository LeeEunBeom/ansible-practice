---
###############################
# 1. Play 01: WEB-PHP-DB 구현
#   1) WEB + PHP + Firewall
#   2) DB 
# 2. Play 02: 웹요청
#   1) 웹 요청
###############################
#
# 1. Play 01: WEB-PHP-DB 구현
#
- name: 1. Play 01 - WEB-PHP-DB 구현
  hosts: webservers
  tasks:
    #   1) WEB + PHP + Firewall
    - name: 1) 패키지 설치 - httpd, mod_ssl, php, php-mysqlnd, php-pdo, firewalld
      ansible.builtin.dnf:
        name:
          - httpd
          - mod_ssl
          - php
          - php-mysqlnd
          - php-pdo
          - firewalld
        state: present

    - name: 2) 서비스 설정 - /var/www/html/index.php
      ansible.builtin.get_url:
        url: http://192.168.10.10/index.php.txt
        dest: /var/www/html/index.php
        mode: '0644'

    - name: 3) 서비스 기동 - httpd, firewalld
      ansible.builtin.service:
        name: "{{ item }}"
        state: started
        enabled: true
      loop:
        - httpd
        - firewalld

    - name: 4) 방화벽 포트 등록 - http, https
      ansible.posix.firewalld:
        service: "{{ item }}"
        permanent: true
        immediate: true
        state: enabled
      loop:
        - http
        - https

  #   2) DB
  #      * 패키지 설치
    - name: 1) 패키지 설치 - mariadb-server, mariadb
      ansible.builtin.dnf:
        name: 
          - mariadb-server
          - mariadb
          - python3-PyMySQL
        state: latest

  #      * 서비스 기동
    - name: 2) 서비스 기동 - mariadb
      ansible.builtin.systemd_service:
        name: mariadb
        enabled: true
        state: started

  #      * 서비스 설정
    - name: 3) 서비스 설정 - mysql_secure_installation
      # become: true
      ansible.builtin.expect:
        command: /usr/bin/mysql_secure_installation
        responses:
          'Enter current password for root': ''
          'Switch to unix_socket authentication': 'Y'
          'Change the root password?': 'Y'
          'New password': 'soldesk1.'
          'Re-enter new password': 'soldesk1.'
          'Remove anonymous users': 'Y'
          'Disallow root login remotely': 'Y'
          'Remove test database and access to it': 'Y'
          'Reload privilege tables now': 'Y'
        timeout: 1

    - name: 3) 서비스 설정 - 사용자/권한 추가
      # become: true
      ansible.mysql.mysql_user:
        login_user: root
        login_password: soldesk1.
        name: soldesk
        password: soldesk1.
        priv: '*.*:ALL'
        state: present

  #      * 방화벽 등록
    - name: 4) 방화벽 포트 등록 - mysql
      ansible.posix.firewalld:
        service: mysql
        permanent: true
        immediate: true
        state: enabled

#
# 2. Play 02 - 웹요청
#
- name: 2. Play 02 - 웹 요청
  hosts: localhost
  become: false
  tasks:
#   1) 웹 요청 
  - name: 1) web1 웹서버에 웹요청 확인
    ansible.builtin.uri:
      url: http://192.168.10.11/index.php
      # method: GET
      status_code: 200
    
