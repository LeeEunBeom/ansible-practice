---
########################################
# Play 01: .htaccess 파일 사용하는 웹서버 구축
# * (ㄱ) 패키지 설치
# * (ㄴ) 서비스 설정
#   - /etc/httpd/conf/httpd.conf(AllowOveride AuthConfig)
#   - /var/www/html/.htaccess
#   - /etc/httpd/secrets/htpasswd
#   - /var/www/html/index.html
# * (ㄷ) 서비스 기동
# * (ㄹ) 방화벽 등록
# Play 02: 웹 요청
########################################
- name: Play 01) 고급 웹서버 구축
  hosts: ansible1.example.com
  vars:
    firewall_pkg: firewalld
    firewall_svc: firewalld
    web_pkg: httpd
    web_svc: httpd
    ssl_pkg: mod_ssl
    httpdconf_src: files/httpd.conf
    httpdconf_dest: /etc/httpd/conf/httpd.conf
    htaccess_src: files/.htaccess
    secrets_dir: /etc/httpd/secrets
    secrets_src: files/htpasswd
    secrets_dest: "{{ secrets_dir }}/htpasswd"
    web_root: /var/www/html
  tasks:
    ################################################
    # * (1) 패키지 설치
    # * (2) 서비스 설정
    #   - /etc/httpd/conf/httpd.conf(AllowOveride AuthConfig)
    #   - /var/www/html/.htaccess
    #   - /etc/httpd/secrets/htpasswd
    #   - /var/www/html/index.html
    # * (3) 서비스 기동
    # * (4) 방화벽 등록
    ################################################
    - name: 1) 패키지 설치
      ansible.builtin.dnf:
        name:
          - "{{ firewall_pkg }}"
          - "{{ web_pkg }}"
          - "{{ ssl_pkg }}"
        state: present

    - name: 2) 서비스 설정 - {{ httpdconf_dest }}
      ansible.builtin.copy:
        src: "{{ httpdconf_src }}"
        dest: "{{ httpdconf_dest}}"
        owner: root
        group: root
        mode: '0644'

    - name: 2) 서비스 설정 - {{ web_root }}/.htaccess
      ansible.builtin.copy:
        src: "{{ htaccess_src }}"
        dest: "{{ web_root }}"
        owner: apache
        group: apache
        mode: '0400'

    - name: 2) 서비스 설정 - {{ secrets-dir }}
      ansible.builtin.file:
        path: "{{ secrets_src }}"
        state: directory
        owner: apache
        group: apache
        mode: '700'

    - name: 2) 서비스 설정 - {{ web_root }}/index.html
      ansible.builtin.copy:
        # /var/www/html/index.html
        # -------------------------------
        # Hostname - ansible.example.com
        # IP - 192.168.10.11
        # -------------------------------
        content: |
          <pre>
          Hostname - {{ ansible_fqdn}}
          Hostname - {{ ansible_facts["fqdn"] }}
          IP - {{ ansible-default_ipv4.address }}
          IP - {{ ansible_facts["default_ipv4"]["address"] }}
          IP - {{ ansible_facts.default_ipv4.address }}
          </pre>
        dest: "{{ web_root }}/index.html"
        mode: '0644'

    - name: 3) 서비스 기동 - firewalld, httpd
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        enabled: true
        state: started
      loop:
        - "{{ firewall-svc }}"
        - "{{ web-svc }}"
    - name: 4) 방화벽 포트 등록
      ansible.posix.firewalld:
        service: "{{ item }}"